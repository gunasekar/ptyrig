name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            os: macos-15
            target: darwin-arm64
            node: '22'
            vscode: '1.95.3'
          - label: release
            os: macos-26
            target: darwin-arm64
            node: '26'
            vscode: stable
          - label: linux-validation
            os: ubuntu-26.04
            target: linux-x64
            node: '26'
            vscode: stable
    name: ${{ matrix.label }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          check-latest: true
      - run: npm install --global npm@12.2.1
      - run: npm ci --strict-allow-scripts
      - run: npm run release:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Check development tooling for high severity findings
        run: npm audit --audit-level=high
      - name: Test real VS Code
        env:
          PTYRIG_VSCODE_VERSION: ${{ matrix.vscode }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:vscode:ci
          else
            npm run test:vscode:ci
          fi
      - run: npm run package
      - name: Verify package
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          python3 scripts/verify-package.py "ptyrig-${VERSION}-${TARGET}.vsix" --target "$TARGET"
      - name: Test the installed release VSIX
        if: matrix.label == 'release'
        env:
          PTYRIG_VSCODE_VERSION: stable
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PTYRIG_VSIX="ptyrig-${VERSION}-${TARGET}.vsix" npm run test:vscode:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ptyrig-${{ matrix.label }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ptyrig-*.vsix
            ptyrig-*.vsix.sha256
            ptyrig-*.sbom.json
